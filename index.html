<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inkline エディタ</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1e1e1c" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- トップバー -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="openBtn" class="tool-btn" title="ファイルを開く (Ctrl+O)">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M2 5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          開く
        </button>
        <button id="newBtn" class="tool-btn" title="新規ファイル (Ctrl+N)">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          新規
        </button>
      </div>

      <div class="topbar-center">
        <span id="fileName" class="file-name">無題のファイル</span>
        <span id="dirtyDot" class="dirty-dot" hidden></span>
      </div>

      <div class="topbar-right">
        <button id="findBtn" class="tool-btn" title="検索と置換 (Ctrl+F)">
          <svg viewBox="0 0 20 20" width="16" height="16"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button id="themeBtn" class="tool-btn" title="ライト/ダーク切替">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 2v2M10 16v2M4 4l1.4 1.4M14.6 14.6L16 16M2 10h2M16 10h2M4 16l1.4-1.4M14.6 5.4L16 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button id="saveBtn" class="tool-btn primary" title="保存 (Ctrl+S)">保存</button>
        <button id="saveAsBtn" class="tool-btn" title="名前を付けて保存 (Ctrl+Shift+S)">名前を付けて保存</button>
      </div>
    </header>

    <!-- 検索・置換パネル -->
    <div id="findPanel" class="find-panel" hidden>
      <input id="findInput" type="text" placeholder="検索" class="find-input" />
      <input id="replaceInput" type="text" placeholder="置換後の文字列" class="find-input" />
      <button id="findPrevBtn" class="find-btn" title="前へ">↑</button>
      <button id="findNextBtn" class="find-btn" title="次へ">↓</button>
      <button id="replaceBtn" class="find-btn">置換</button>
      <button id="replaceAllBtn" class="find-btn">すべて置換</button>
      <span id="findCount" class="find-count"></span>
      <button id="findCloseBtn" class="find-close" title="閉じる">×</button>
    </div>

    <!-- エディタ本体 -->
    <div class="editor-wrap">
      <div id="gutter" class="gutter"></div>
      <textarea
        id="editor"
        class="editor"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        placeholder="ここに書き始めてください…"
      ></textarea>
    </div>

    <!-- ステータスバー(タイプライター風カウンター) -->
    <footer class="statusbar">
      <div class="counter-box" title="行番号:列番号">
        <span id="lineCol">1:1</span>
      </div>
      <div class="counter-box" title="文字数">
        <span id="charCount">0</span>
        <label>文字</label>
      </div>
      <div class="counter-box" title="単語数">
        <span id="wordCount">0</span>
        <label>語</label>
      </div>
      <div class="counter-box" title="行数">
        <span id="lineTotal">1</span>
        <label>行</label>
      </div>
      <div class="spacer"></div>
      <span id="statusMsg" class="status-msg">準備完了</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
